<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Browse, recolor, and export icons as SVG, PNG, or WebP." />
    <meta name="theme-color" content="#f0f6fc" />
    <title>Apiro Free Icon Picker</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css?v=20260805-5" />
    <script defer src="icon-manifest.js?v=20260805-5"></script>
    <script defer src="app.js?v=20260805-5"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="banner" aria-label="Icon library overview">
        <div>
          <h1>Apiro Free Icon Picker</h1>
        </div>
        <a class="plugin-link" href="https://wordpress.org/plugins/apiro-icons/" target="_blank" rel="noopener noreferrer">
          Use icons on WordPress: download plugin
        </a>
        <div class="banner-stats">
          <span id="totalCount">0 icons</span>
          <span id="categoryCount">0 styles</span>
        </div>
      </section>

      <section class="workspace" aria-label="Icon browser and editor">
        <section class="browser-panel" aria-label="Browse icons">
          <label class="search-box">
            <span>Search</span>
            <div class="search-input-wrapper">
              <input id="searchInput" type="search" placeholder="heart, github, arrow..." autocomplete="off" />
              <button id="clearSearch" type="button" class="search-clear-btn" aria-label="Clear search" hidden>✕</button>
            </div>
          </label>

          <div class="tabs-container">
            <div id="familyTabs" class="tabs family-tabs" role="tablist" aria-label="Icon Libraries"></div>
            <div id="styleTabs" class="tabs style-tabs tabs-hidden" role="tablist" aria-label="Library Styles"></div>
          </div>

          <div class="result-row">
            <span id="resultCount">0 results</span>
            <span id="activeCategory">All categories</span>
          </div>

          <div id="iconScroll" class="icon-scroll">
            <div id="iconGrid" class="icon-grid" aria-live="polite"></div>
            <button id="loadMore" class="load-more" type="button">Load more</button>
            <p id="emptyState" class="empty-state">No icons found.</p>
          </div>
        </section>

        <aside class="editor-panel" aria-label="Selected icon editor">
          <div class="preview-stage">
            <div id="previewBox" class="preview-box">
              <span>Select an icon</span>
            </div>
          </div>

          <div class="selected-meta">
            <p id="selectedName">No icon selected</p>
            <span id="selectedPath">Choose one from the shelf</span>
          </div>

          <div class="controls">
            <div id="colorControlsContainer" class="color-controls-container">
              <div class="color-control-wrapper">
                <span class="color-label-text">Icon color</span>
                <input id="iconColor" class="color-swatch-picker" type="color" value="#0f172a" title="Pick color" aria-label="Color picker swatch" />
              </div>
            </div>
            <label>
              Canvas size
              <select id="exportSize">
                <option value="128">128px</option>
                <option value="256" selected>256px</option>
                <option value="512">512px</option>
                <option value="1024">1024px</option>
              </select>
            </label>
            <label class="range-control">
              <span class="range-head">
                <span>Trace width</span>
                <span id="strokeValue" class="range-value">0</span>
              </span>
              <input id="strokeRange" type="range" min="-24" max="24" value="0" step="1" />
            </label>
            <label class="range-control">
              <span class="range-head">
                <span>Padding</span>
                <span id="paddingValue" class="range-value">32px</span>
              </span>
              <input id="paddingRange" type="range" min="0" max="96" value="32" />
            </label>
          </div>

          <div class="download-row">
            <button id="downloadSvg" type="button" disabled>SVG</button>
            <button id="downloadPng" type="button" disabled>PNG</button>
            <button id="downloadWebp" type="button" disabled>WebP</button>
            <button id="copySvg" type="button" disabled>Copy SVG</button>
          </div>
          <p id="copyStatus" class="copy-status" role="status" aria-live="polite"></p>
        </aside>
      </section>
    </main>

  </body>
</html>
